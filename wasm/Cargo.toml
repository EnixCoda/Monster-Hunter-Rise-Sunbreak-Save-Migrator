[package]
name = "mhsave-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ree-lib = { path = "/tmp/reefresh", features = ["save"], default-features = false }
wasm-bindgen = "0.2"
js-sys = "0.3"

[profile.release]
opt-level = "s"
lto = true

[patch.crates-io]
zstd = { path = "zstd-stub" }
